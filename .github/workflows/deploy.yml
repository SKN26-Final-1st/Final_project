name: Deploy Frontend & Backend by SSM

on:
  push:
    branches: [ dev ]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".deploy/frontend.conf"
      - ".deploy/backend.conf"
      - ".deploy/gunicorn.service"
      - ".deploy/celery.service"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v7

      - name: Node.js 설치
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: 프론트 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: 프론트 빌드
        working-directory: frontend
        env:
          VITE_API_PROXY_TARGET: ${{ secrets.VITE_API_PROXY_TARGET }}
        run: npm run build

      - name: AWS 인증 설정
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_ACCESS_REGION }}

      - name: S3에 프론트 빌드 파일 업로드
        run: |
          aws s3 sync frontend/dist s3://${{ secrets.S3_DEPLOY_BUCKET }}/frontend/ --delete

      - name: S3에 Nginx conf 업로드
        run: |
          aws s3 cp .deploy/frontend.conf s3://${{ secrets.S3_DEPLOY_BUCKET }}/nginx/frontend.conf

      - name: SSM으로 EC2에 배포 명령 실행
        id: ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_FRONTEND_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy frontend from GitHub Actions" \
            --parameters 'commands=[
              "set -e",
              "sudo mkdir -p /var/www/app/frontend",
              "sudo aws s3 sync s3://${{ secrets.S3_DEPLOY_BUCKET }}/frontend/ /var/www/app/frontend/ --delete --exact-timestamps",
              "sudo aws s3 cp s3://${{ secrets.S3_DEPLOY_BUCKET }}/frontend/index.html /var/www/app/frontend/index.html",
              "sudo aws s3 cp s3://${{ secrets.S3_DEPLOY_BUCKET }}/nginx/frontend.conf /etc/nginx/conf.d/frontend.conf",
              "sudo nginx -t",
              "sudo systemctl enable nginx",
              "sudo systemctl reload-or-restart nginx"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: SSM 명령 완료 대기
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ secrets.AWS_FRONTEND_INSTANCE_ID }}" || true

      - name: SSM 명령 결과 출력
        if: always()
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ secrets.AWS_FRONTEND_INSTANCE_ID }}" \
            --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
            --output json

          STATUS=$(aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ secrets.AWS_FRONTEND_INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          test "$STATUS" = "Success"

  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v7

      - name: AWS 인증 설정
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_ACCESS_REGION }}

      - name: S3에 백엔드 소스 업로드
        run: |
          aws s3 sync backend/ s3://${{ secrets.S3_DEPLOY_BUCKET }}/backend/ \
            --delete \
            --exclude ".venv/*" \
            --exclude "__pycache__/*" \
            --exclude "*.pyc" \
            --exclude "db.sqlite3" \
            --exclude ".env"

      - name: S3에 Nginx backend conf 업로드
        run: |
          aws s3 cp .deploy/backend.conf s3://${{ secrets.S3_DEPLOY_BUCKET }}/nginx/backend.conf

      - name: S3에 Gunicorn service 업로드
        run: |
          aws s3 cp .deploy/gunicorn.service s3://${{ secrets.S3_DEPLOY_BUCKET }}/systemd/gunicorn.service

      - name: S3에 Celery service 업로드
        run: |
          aws s3 cp .deploy/celery.service s3://${{ secrets.S3_DEPLOY_BUCKET }}/systemd/celery.service

      - name: SSM backend 1 - 소스 동기화
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Backend deploy 1 - sync source" \
            --parameters 'commands=[
              "set -e",
              "sudo mkdir -p /var/www/app/backend",
              "sudo chown -R ec2-user:ec2-user /var/www/app",
              "sudo -u ec2-user aws s3 sync s3://${{ secrets.S3_DEPLOY_BUCKET }}/backend/ /var/www/app/backend/ --delete --exclude \".venv/*\"",
              "sudo chown -R ec2-user:ec2-user /var/www/app/backend"
            ]' \
            --query "Command.CommandId" \
            --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" --output json
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" --query "Status" --output text)
          test "$STATUS" = "Success"

      - name: SSM backend 2 - 설정 파일 설치
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Backend deploy 2 - install config files" \
            --parameters 'commands=[
              "set -e",
              "sudo aws s3 cp s3://${{ secrets.S3_DEPLOY_BUCKET }}/nginx/backend.conf /etc/nginx/conf.d/backend.conf",
              "sudo aws s3 cp s3://${{ secrets.S3_DEPLOY_BUCKET }}/systemd/gunicorn.service /etc/systemd/system/myapp-gunicorn.service",
              "sudo aws s3 cp s3://${{ secrets.S3_DEPLOY_BUCKET }}/systemd/celery.service /etc/systemd/system/myapp-celery.service",
              "sudo systemctl daemon-reload"
            ]' \
            --query "Command.CommandId" \
            --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" --output json
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" --query "Status" --output text)
          test "$STATUS" = "Success"

      - name: SSM backend 3 - Python 의존성 설치
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Backend deploy 3 - install python dependencies" \
            --parameters 'commands=[
              "set -e",
              "cd /var/www/app/backend",
              "if [ ! -d /var/www/app/backend/.venv ]; then sudo -u ec2-user python3.14 -m venv /var/www/app/backend/.venv; fi",
              "sudo chown -R ec2-user:ec2-user /var/www/app/backend/.venv",
              "sudo -u ec2-user bash -lc \"cd /var/www/app/backend && source .venv/bin/activate && python -m pip install --upgrade pip\"",
              "sudo -u ec2-user bash -lc \"cd /var/www/app/backend && source .venv/bin/activate && pip install -r requirements.txt\""
            ]' \
            --query "Command.CommandId" \
            --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" --output json
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" --query "Status" --output text)
          test "$STATUS" = "Success"

      - name: SSM backend 4a - Django check
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Backend deploy 4a - django check" \
            --parameters 'commands=[
              "set -e",
              "sudo -u ec2-user bash -lc \"cd /var/www/app/backend && source .venv/bin/activate && set -a && source /etc/secrets.env && set +a && python manage.py check\""
            ]' \
            --query "Command.CommandId" \
            --output text)
          for i in {1..120}; do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" --query "Status" --output text)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
              *) sleep 5 ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" --output json
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" --query "Status" --output text)
          test "$STATUS" = "Success"

      - name: SSM backend 4b - Django migrate
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Backend deploy 4b - django migrate" \
            --parameters 'commands=[
              "set -e",
              "sudo -u ec2-user bash -lc \"cd /var/www/app/backend && source .venv/bin/activate && set -a && source /etc/secrets.env && set +a && python manage.py migrate\""
            ]' \
            --query "Command.CommandId" \
            --output text)
          for i in {1..120}; do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" --query "Status" --output text)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
              *) sleep 5 ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" --output json
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" --query "Status" --output text)
          test "$STATUS" = "Success"

      - name: SSM backend 4c - Django collectstatic
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Backend deploy 4c - django collectstatic" \
            --parameters 'commands=[
              "set -e",
              "sudo -u ec2-user bash -lc \"cd /var/www/app/backend && source .venv/bin/activate && set -a && source /etc/secrets.env && set +a && python manage.py collectstatic --noinput\""
            ]' \
            --query "Command.CommandId" \
            --output text)
          for i in {1..120}; do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" --query "Status" --output text)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
              *) sleep 5 ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" --output json
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" --query "Status" --output text)
          test "$STATUS" = "Success"

      - name: SSM backend 5 - Valkey/Celery 재시작
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Backend deploy 5 - restart celery" \
            --parameters 'commands=[
              "set -e",
              "sudo systemctl enable --now valkey",
              "sudo systemctl restart myapp-celery",
              "sudo systemctl enable myapp-celery",
              "sudo systemctl is-active --quiet myapp-celery",
              "sudo systemctl status myapp-celery --no-pager"
            ]' \
            --query "Command.CommandId" \
            --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" --output json
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" --query "Status" --output text)
          test "$STATUS" = "Success"

      - name: SSM backend 6 - Gunicorn 재시작
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Backend deploy 6 - restart gunicorn" \
            --parameters 'commands=[
              "set -e",
              "sudo systemctl restart myapp-gunicorn",
              "sudo systemctl enable myapp-gunicorn",
              "sudo systemctl is-active --quiet myapp-gunicorn",
              "sudo systemctl status myapp-gunicorn --no-pager"
            ]' \
            --query "Command.CommandId" \
            --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" --output json
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" --query "Status" --output text)
          test "$STATUS" = "Success"

      - name: SSM backend 7 - Nginx 적용
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Backend deploy 7 - reload nginx" \
            --parameters 'commands=[
              "set -e",
              "sudo nginx -t",
              "sudo systemctl enable nginx",
              "sudo systemctl reload-or-restart nginx",
              "sudo systemctl is-active --quiet nginx",
              "sudo systemctl status nginx --no-pager"
            ]' \
            --query "Command.CommandId" \
            --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" --output json
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" --query "Status" --output text)
          test "$STATUS" = "Success"

      - name: SSM backend 8 - 헬스 체크
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Backend deploy 8 - health check" \
            --parameters 'commands=[
              "set -e",
              "curl -f http://127.0.0.1/api/ping/"
            ]' \
            --query "Command.CommandId" \
            --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" --output json
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_BACKEND_INSTANCE_ID }}" --query "Status" --output text)
          test "$STATUS" = "Success"
